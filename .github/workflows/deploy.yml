name: Deploy to GitHub Pages

# The published site is assembled fresh on every run, because deploy-pages
# replaces the whole site each time. Layout:
#
#   /                  latest published release (falls back to main until the
#                      first release exists)
#   /dev/              latest main
#   /test/<branch>/    every open PR
#   /*.json, /*.csv    datasets, always from main — see "Copy datasets" below
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  # Fires only for a release published by a human through the GitHub UI — events
  # raised by GITHUB_TOKEN never create workflow runs, so release.yml cannot rely
  # on this and dispatches a run explicitly instead. Keep both: this covers the
  # manual path, the dispatch covers the workflow path.
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # Fork PRs never get the id-token permission, so deploy-pages can't
    # authenticate from their runs — skip them entirely. Contributor PRs get
    # previews via the maintainer-invoked /preview comment command instead.
    # (Skipping this job auto-skips the deploy job via `needs`.)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # Single source for the dataset copy, which used to be duplicated per
      # build target and drifted. Kept as a file because each `run:` block is a
      # separate shell.
      - name: Create dataset copy helper
        run: |
          cat > /tmp/copy-data.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          dest="$1"
          mkdir -p "$dest"
          for f in rptrs.json tafl_min.json airports_min.json radioid-users.csv; do
            cp "src/data/$f" "$dest/$f"
          done
          EOF
          chmod +x /tmp/copy-data.sh

      # NOTE: every build below runs `npm ci` after its `git checkout` — this
      # workflow builds several refs (main + each open PR) in one job, and each
      # ref can have different dependencies. A single shared install broke the
      # moment a PR changed package.json.
      # No VITE_COMMIT_HASH here on purpose: this step builds *main*, but
      # github.sha is the PR merge commit on pull_request events and the tag's
      # commit on release events. vite.config.ts falls back to
      # `git rev-parse --short HEAD`, which after the checkout below is right.
      - name: Build main (production) -> /dev/
        run: |
          set -euo pipefail
          git checkout main
          npm ci
          npm run build:single
          rm -rf dist_root dist_dev dist_test
          mkdir -p dist_dev
          mv dist/* dist_dev/

      # The root is the *exact artifact that was tested and published*, not a
      # rebuild of the tag: for software that writes to radio hardware, the file
      # users download offline and the file the site serves must be byte-identical.
      - name: Fetch latest release -> /
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist_root
          repo="${{ github.repository }}"

          # Deliberately three branches, not "try and fall back on any error".
          # Collapsing them meant a rate limit or a 5xx silently replaced the
          # release at `/` with an untested build of main — advertised to users as
          # the stable version — and the next deploy quietly undid it, so nobody
          # would ever find out.
          #
          # Keyed on the tag name rather than on gh's exit code: with zero releases
          # published, `gh release view` returning empty and `gh release view`
          # exiting non-zero must both mean "no release yet". Branching on the exit
          # code alone would hard-fail every deploy until the first release exists.
          tag=$(gh release view --repo "$repo" --json tagName --jq '.tagName' 2>/dev/null || true)

          if [ -z "$tag" ]; then
            echo "::notice::No published release yet — serving main at the root until the first release is cut."
            cp dist_dev/index.html dist_root/index.html
          elif ! gh release view "$tag" --repo "$repo" --json assets --jq '.assets[].name' | grep -qx 'neonplug-latest.html'; then
            echo "::error::Release $tag has no neonplug-latest.html asset. Releases must be cut by release.yml, which uploads it; a hand-made release will not serve. Refusing to silently publish main at the root."
            exit 1
          else
            # No error suppression and no fallback: a transient failure here must
            # fail the deploy, not quietly downgrade what the site serves.
            gh release download "$tag" --repo "$repo" \
              --pattern 'neonplug-latest.html' --output dist_root/index.html
            echo "Site root = $tag release asset"
          fi

      # Datasets are deliberately NOT pinned to the release. src/services/jsonLoader.ts
      # and ContactsTab.tsx both try https://neonplug.app/<file> first and fall back
      # to raw.githubusercontent.com on main, so this data is already "latest from
      # main" by design. Pinning it would freeze repeater/DMR-user data at tag time
      # and add ~30 MB to every release.
      - name: Copy datasets (from main) to root and /dev/
        run: |
          /tmp/copy-data.sh dist_root
          /tmp/copy-data.sh dist_dev

      - name: List open PRs and build previews
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sanitize() {
            echo "$1" | sed 's/\//-/g' | sed 's/[^a-zA-Z0-9_-]//g' | cut -c1-50
          }
          prs=$(gh pr list --base main --state open --json number,headRefName -q '.[] | "\(.number)|\(.headRefName)"')
          for entry in $prs; do
            num="${entry%%|*}"
            branch="${entry#*|}"
            [ -z "$num" ] && continue
            name=$(sanitize "$branch")
            [ -z "$name" ] && name="pr-$num"
            echo "Building PR #$num branch=$branch -> test/$name"
            git fetch origin "pull/$num/head:pr-$num" 2>/dev/null || git fetch origin "$branch" 2>/dev/null || true
            git checkout "pr-$num" 2>/dev/null || git checkout "$branch"
            # A PR that doesn't build must not take the whole deploy with it. The
            # default shell is `bash -e`, so without this guard one broken open PR
            # aborts the step, the job, and the deploy — which now includes the
            # release at `/`, so a stale PR could block a freshly cut release from
            # ever reaching the site.
            if ! ( npm ci && npm run build:single ); then
              echo "::warning::PR #$num ($branch) failed to build — preview skipped"
              continue
            fi
            mkdir -p "dist_test/$name"
            mv dist/* "dist_test/$name/"
            /tmp/copy-data.sh "dist_test/$name"
          done

      - name: Combine artifact
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp -r dist_root/. dist/
          mkdir -p dist/dev
          cp -r dist_dev/. dist/dev/
          if [ -d dist_test ]; then
            for d in dist_test/*/; do
              [ -d "$d" ] || continue
              name=$(basename "$d")
              mkdir -p "dist/test/$name"
              cp -r "$d"* "dist/test/$name/"
            done
          fi
          echo "Published tree:"
          # depth 3 — PR previews live at dist/test/<name>/index.html
          find dist -maxdepth 3 -name index.html | sort

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Save PR preview info
        if: github.event_name == 'pull_request'
        run: |
          branch="${{ github.head_ref }}"
          name=$(echo "$branch" | sed 's/\//-/g' | sed 's/[^a-zA-Z0-9_-]//g' | cut -c1-50)
          [ -z "$name" ] && name="pr-${{ github.event.pull_request.number }}"
          url="https://neonplug.app/test/${name}/"
          mkdir -p pr-preview
          echo "${{ github.event.pull_request.number }}" > pr-preview/pr_number.txt
          echo "$url" > pr-preview/preview_url.txt

      - name: Upload PR preview info
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview
          path: pr-preview/
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
